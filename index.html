<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smelly Games</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #222;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .game-card {
            background-color: #fff;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .game-card h2 {
            margin-top: 0;
        }

        .game-card p {
            color: #555;
        }

        .game-card a {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .game-card a:hover {
            background-color: #218838;
        }

        footer {
            text-align: center;
            padding: 15px;
            background-color: #222;
            color: #fff;
        }
    </style>
</head>
<body>

    <header>
        <h1>Smelly Games</h1>
        <p>The stinkiest games on the internet</p>
    </header>

    <main class="games-container">
        <!-- GAME CARD START -->
        <div class="game-card">
            <h2>Game Name</h2>
            <p>Short description of the game.</p>
            <a href="#">Play Game</a>
        </div>
        <!-- GAME CARD END -->

        <!-- Copy and paste this block to add more games -->
    </main>

    <footer>
        <p>© 2026 Smelly Games</p>
    </footer>

</body>
</html>
