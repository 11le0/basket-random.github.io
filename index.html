<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smelly Games</title>

  <!-- Montserrat Font -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0a0a0a;
      color: #f5f5f5;
      padding: 32px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 32px;
    }

    .search-bar {
      margin-bottom: 32px;
    }

    .search-bar input {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #262626;
      background-color: #111;
      color: #f5f5f5;
      font-weight: 600;
    }

    .search-bar input:focus {
      outline: none;
      border-color: #404040;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 24px;
    }

    .game-card {
      background-color: #111;
      padding: 24px;
      border-radius: 16px;
      transition: background-color 0.2s ease;
      text-align: center;
    }

    .game-card:hover {
      background-color: #1a1a1a;
    }

    .game-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .game-desc {
      font-size: 0.9rem;
      color: #9ca3af;
      margin-bottom: 16px;
    }

    .play-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      background-color: #f5f5f5;
      color: #0a0a0a;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .play-btn:hover {
      background-color: #e5e5e5;
    }
  </style>
</head>
<body>

  <h1>Smelly Games</h1>
  <p class="subtitle">A minimilistic game hub.</p>

  <!-- Search Bar -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search games..." />
  </div>

  <!-- Games Grid -->
  <div class="games-grid" id="gamesGrid">

    <!-- Game Card -->
    <div class="game-card" data-title="Escape Road 2">
      <h2>Escape Road 2</h2>
      <p>Steal money and get away from the police!</p>
      <a href="games/escaperoad2.html" class="play-btn">Play</a>
     
      <div class="game-card" data-title="Drive Mad">
      <h2>Drive Mad</h2>
      <p>Drive a truck in levels!</p>
      <a href="games/drivemad.html" class="play-btn">Play</a>

         <div class="game-card" data-title="Basket Random">
      <h2>Basket Random</h2>
      <p></p>
      <a href="games/basketrandom.html" class="play-btn">Play</a>
    </div>

    <!-- Copy & paste game cards as needed -->

  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const gameCards = document.querySelectorAll('.game-card');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();

      gameCards.forEach(card => {
        const title = card.dataset.title.toLowerCase();
        card.style.display = title.includes(query) ? 'block' : 'none';
      });
    });
  </script>

</body>
</html>
