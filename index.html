<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smelly Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0a0a0a;
      color: #f5f5f5;
      padding: 32px;
    }

    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #9ca3af; margin-bottom: 32px; }

    /* Search Bar */
    .search-bar { margin-bottom: 32px; }
    .search-bar input {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #262626;
      background-color: #111;
      color: #f5f5f5;
      font-weight: 600;
    }

    /* THE FIX: CSS Grid for 4 columns */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 4 equal columns */
      gap: 24px;
      width: 100%;
    }

    /* Responsive: 2 columns on tablets, 1 on phones */
    @media (max-width: 1024px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .games-grid { grid-template-columns: 1fr; } }

    .game-card {
      position: relative;
      background-color: #111;
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #262626;
      transition: transform 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-5px);
      background-color: #1a1a1a;
    }

    .game-card h2 { font-size: 1.25rem; margin-bottom: 16px; }

    .play-btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 12px;
      background-color: #f5f5f5;
      color: #0a0a0a;
      font-weight: 700;
      text-decoration: none;
    }

    .play-btn:hover { background-color: #e5e5e5; }
  </style>
</head>
<body>

  <h1>Smelly Games</h1>
  <p class="subtitle">A collection of games. Weird. Fun. Yours.</p>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search games..." />
  </div>

  <div class="games-grid" id="gamesGrid">
    <!-- Game Cards (Properly closed tags) -->
    <div class="game-card"><h2>Snow Rider 3D</h2><a href="games/snowrider.html" class="play-btn">Play</a></div>
    <div class="game-card"><h2>Basket Random</h2><a href="games/basketrandom.html" class="play-btn">Play</a></div>
    <div class="game-card"><h2>Monkey Mart</h2><a href="games/monkeymart.html" class="play-btn">Play</a></div>
    <div class="game-card"><h2>Bacon May Die</h2><a href="games/baconmaydie.html" class="play-btn">Play</a></div>
    <div class="game-card"><h2>Subway Surfers</h2><a href="games/subwaysurfers.html" class="play-btn">Play</a></div>
    <div class="game-card"><h2>Drive Mad</h2><a href="games/drivemad.html" class="play-btn">Play</a></div>
    <div class="game-card"><h2>BitLife</h2><a href="games/bitlife.html" class="play-btn">Play</a></div>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const cards = document.querySelectorAll('.game-card');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      cards.forEach(card => {
        const title = card.querySelector('h2').textContent.toLowerCase();
        // Use 'grid' instead of 'block' to maintain layout
        card.style.display = title.includes(query) ? 'block' : 'none';
      });
    });
  </script>

</body>
</html>
