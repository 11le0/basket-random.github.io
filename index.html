<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Portal</title>
    <style>
        :root {
            --bg-dark: #0a0b10;
            --card-bg: #161b22;
            --accent: #8b5cf6; /* Electric Purple */
            --accent-hover: #a78bfa;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Header & Navigation */
        header {
            padding: 1.5rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 11, 16, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo { font-size: 1.5rem; font-weight: 800; color: var(--accent); text-transform: uppercase; cursor: pointer; }

        /* Search Bar */
        .search-container { padding: 2rem 5%; max-width: 1200px; margin: 0 auto; }
        #gameSearch {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 2px solid var(--card-bg);
            background: var(--card-bg);
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }
        #gameSearch:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 15px rgba(139, 92, 246, 0.3); }

        /* Games Grid */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
            padding: 0 5% 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 2rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1/1;
        }

        .game-card:hover {
            transform: translateY(-8px);
            background: #1c2128;
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .game-card h3 { font-size: 1.1rem; margin-top: 10px; }

        /* Fullscreen Player Overlay */
        #playerOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark);
            z-index: 1000;
            display: none;
            flex-direction: column;
        }

        .player-nav {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
        }

        iframe { flex-grow: 1; border: none; background: #000; }

        .btn {
            background: var(--accent);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .btn:hover { background: var(--accent-hover); }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="location.reload()">Game Portal</div>
    </header>

    <div class="search-container">
        <input type="text" id="gameSearch" placeholder="Search for a game..." onkeyup="filterGames()">
    </div>

    <div class="games-grid" id="gameGrid">
        <!-- Games will be loaded here by JavaScript -->
    </div>

    <!-- The Hidden Game Player -->
    <div id="playerOverlay">
        <div class="player-nav">
            <h2 id="currentTitle">Game Name</h2>
            <div>
                <button class="btn" onclick="toggleFullscreen()">Fullscreen</button>
                <button class="btn" style="background: #ef4444;" onclick="closeGame()">Close</button>
            </div>
        </div>
        <iframe id="gameFrame" src=""></iframe>
    </div>

    <script>
        // LIST YOUR GAMES HERE
        // The ID must match the folder name in your /games/ folder
        const games = [
            { id: "2048", title: "2048 Classic" },
            { id: "flappy-bird", title: "Flappy Bird" }
        ];

        const grid = document.getElementById('gameGrid');

        function loadGames(list) {
            grid.innerHTML = '';
            list.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `<h3>${game.title}</h3>`;
                card.onclick = () => openGame(game.id, game.title);
                grid.appendChild(card);
            });
        }

        function openGame(id, title) {
            const overlay = document.getElementById('playerOverlay');
            const frame = document.getElementById('gameFrame');
            document.getElementById('currentTitle').innerText = title;
            
            // Path to your game folder
            frame.src = `./games/${id}/index.html`; 
            overlay.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // Stop scrolling
        }

        function closeGame() {
            const overlay = document.getElementById('playerOverlay');
            const frame = document.getElementById('gameFrame');
            frame.src = ""; // Stop game audio/logic
            overlay.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function filterGames() {
            const term = document.getElementById('gameSearch').value.toLowerCase();
            const filtered = games.filter(g => g.title.toLowerCase().includes(term));
            loadGames(filtered);
        }

        function toggleFullscreen() {
            const frame = document.getElementById('gameFrame');
            if (frame.requestFullscreen) frame.requestFullscreen();
        }

        // Initial Load
        loadGames(games);
    </script>
</body>
</html>
