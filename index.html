<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smelly Games</title>

    <!-- Montserrat Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            background-color: #0f0f0f;
            color: #eaeaea;
        }

        header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid #1f1f1f;
        }

        header h1 {
            margin: 0;
            font-size: 3rem;
            letter-spacing: 1px;
        }

        header p {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #9a9a9a;
            font-weight: 600;
        }

        .games-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .game-card {
            background-color: #161616;
            border-radius: 10px;
            padding: 24px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .game-card:hover {
            transform: translateY(-4px);
            background-color: #1c1c1c;
        }

        .game-card h2 {
            margin: 0 0 10px;
            font-size: 1.2rem;
        }

        .game-card p {
            margin: 0;
            font-size: 0.85rem;
            color: #b5b5b5;
            font-weight: 600;
        }

        .game-card a {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            color: #0f0f0f;
            background-color: #eaeaea;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            transition: opacity 0.2s ease;
        }

        .game-card a:hover {
            opacity: 0.8;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 0.75rem;
            color: #6f6f6f;
            border-top: 1px solid #1f1f1f;
        }
    </style>
</head>
<body>

    <header>
        <h1>Smelly Games</h1>
        <p>Minimal. Dark. Slightly stinky.</p>
    </header>

    <main class="games-container">
        <!-- GAME CARD -->
        <div class="game-card">
            <h2>Basket Random</h2>
            <p>A fun game that can turn into chaos!</p>
            <a href="games/flappy.html">Play</a>
        </div>

        <!-- Copy this card to add more games -->
    </main>

    <footer>
        © 2026 Smelly Games
    </footer>

</body>
</html>
