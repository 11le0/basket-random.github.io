<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smelly Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: #0a0a0a;
      color: #f5f5f5;
      padding: 32px;
    }

    h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: #9ca3af; margin-bottom: 32px; }

    .search-bar { margin-bottom: 32px; }
    .search-bar input {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #262626;
      background-color: #111;
      color: #f5f5f5;
      font-weight: 600;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
      width: 100%;
    }

    @media (max-width: 1024px) { .games-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 600px) { .games-grid { grid-template-columns: 1fr; } }

    .game-card {
      position: relative;
      background-color: #111;
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      border: 1px solid #262626;
      transition: transform 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-5px);
      background-color: #1a1a1a;
    }

    .game-card h2 { font-size: 1.25rem; margin-bottom: 16px; }

    .play-btn {
      display: inline-block;
      padding: 10px 24px;
      border-radius: 12px;
      background-color: #f5f5f5;
      color: #0a0a0a;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }

    .play-btn:hover { background-color: #e5e5e5; }

    /* Game View Overlay */
    #gameOverlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      z-index: 1000;
    }

    #gameOverlay iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Controls Container */
    .game-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 1001;
    }

    .control-btn {
      background: rgba(17, 17, 17, 0.8);
      color: #f5f5f5;
      border: 1px solid #262626;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }

    .control-btn:hover {
      background: #f5f5f5;
      color: #0a0a0a;
    }
  </style>
</head>
<body>

  <div id="mainContent">
    <h1>Smelly Games</h1>
    <p class="subtitle">A collection of games. Weird. Fun. Yours.</p>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search games..." />
    </div>

    <div class="games-grid" id="gamesGrid">
      <div class="game-card"><h2>Snow Rider 3D</h2><button onclick="openGame('games/snowrider.html')" class="play-btn">Play</button></div>
      <div class="game-card"><h2>Basket Random</h2><button onclick="openGame('games/basketrandom.html')" class="play-btn">Play</button></div>
      <div class="game-card"><h2>Monkey Mart</h2><button onclick="openGame('games/monkeymart.html')" class="play-btn">Play</button></div>
      <div class="game-card"><h2>Bacon May Die</h2><button onclick="openGame('games/baconmaydie.html')" class="play-btn">Play</button></div>
      <div class="game-card"><h2>Subway Surfers</h2><button onclick="openGame('games/subwaysurfers.html')" class="play-btn">Play</button></div>
      <div class="game-card"><h2>Drive Mad</h2><button onclick="openGame('games/drivemad.html')" class="play-btn">Play</button></div>
      <div class="game-card"><h2>BitLife</h2><button onclick="openGame('games/bitlife.html')" class="play-btn">Play</button></div>
        <div class="game-card"><h2>Poly Track</h2><button onclick="openGame('games/polytrack.html')" class="play-btn">Play</button></div>
    </div>
  </div>

  <!-- Game Overlay Structure -->
  <div id="gameOverlay">
    <div class="game-controls">
      <button class="control-btn" onclick="toggleFullscreen()">Fullscreen</button>
      <button class="control-btn" onclick="closeGame()">Home</button>
    </div>
    <iframe id="gameFrame" src=""></iframe>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const cards = document.querySelectorAll('.game-card');
    const overlay = document.getElementById('gameOverlay');
    const gameFrame = document.getElementById('gameFrame');

    // Search Logic
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      cards.forEach(card => {
        const title = card.querySelector('h2').textContent.toLowerCase();
        card.style.display = title.includes(query) ? 'block' : 'none';
      });
    });

    // Game Control Logic
    function openGame(url) {
      gameFrame.src = url;
      overlay.style.display = 'block';
      document.body.style.overflow = 'hidden'; // Disable scrolling
    }

    function closeGame() {
      gameFrame.src = '';
      overlay.style.display = 'none';
      document.body.style.overflow = 'auto'; // Re-enable scrolling
      if (document.fullscreenElement) {
        document.exitFullscreen();
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        overlay.requestFullscreen().catch(err => {
          alert(`Error attempting to enable full-screen mode: ${err.message}`);
        });
      } else {
        document.exitFullscreen();
      }
    }
  </script>

</body>
</html>
