<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basket Random - No Ads</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* Ensures the game takes up the full browser window */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* Removes borders and scrollbars from the game window */
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>
    <!-- This pulls a clean, ad-free build directly from a public repository -->
    <iframe 
        src="https://ubg98.github.io" 
        allow="autoplay; fullscreen; keyboard" 
        scrolling="no">
    </iframe>
</body>
</html>
